[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scene-create"
version = "0.2.0"
description = "Single-process object-centric scene reconstruction pipeline"
requires-python = ">=3.9"
dependencies = [
  "numpy==1.26.4",
  "scipy==1.17.1",
  "Pillow==11.3.0",
  "PyYAML==6.0.3",
  "loguru==0.7.3",
  "trimesh==5.2.0",
  "plyfile==1.1.3",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "ruff==0.9.10"]

[project.scripts]
scene-create = "scene_create.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py39"
line-length = 200
extend-exclude = ["third_parts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# UP007/UP045 would rewrite Optional[T] into the Python 3.10 "T | None" syntax.
ignore = ["UP007", "UP045"]
