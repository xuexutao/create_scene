[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scene-create"
version = "0.1.0"
description = "Object-centric scene reconstruction with isolated model workers"
requires-python = ">=3.9"
dependencies = [
  "numpy==1.26.4",
  "scipy==1.13.1",
  "Pillow==10.4.0",
  "PyYAML==6.0.2",
  "loguru==0.7.3",
  "trimesh==4.5.3",
  "plyfile==1.1",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "ruff==0.9.10"]

[project.scripts]
scene-create = "scene_create.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
